name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hanzoai/studio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    uses: hanzoai/universe/.github/workflows/reusable-deploy-service.yml@main
    with:
      service: studio
      image: ghcr.io/hanzoai/studio:${{ github.sha }}
      cluster: hanzo-k8s
      namespace: hanzo
    secrets:
      KMS_K8S_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
      KMS_K8S_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
