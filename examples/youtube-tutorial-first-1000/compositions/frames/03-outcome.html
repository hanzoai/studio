<template>
<style>
@font-face { font-family: "Zen"; src: url('assets/fonts/zen.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: "Zen Mono"; src: url('assets/fonts/zen-mono.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
#root { position: absolute; inset: 0; overflow: hidden; font-family: "Zen", sans-serif; color: #F6F6F3; }
[id="03-outcome-ground"] { position: absolute; inset: 0; background: #0B0B0D; }
[id="03-outcome-scene"] { position: absolute; inset: 0; overflow: hidden; }
[id="03-outcome-world"] { position: absolute; inset: 0; transform-origin: 40% 45%; will-change: transform; }

[id="03-outcome-window"] { position: absolute; left: 1540px; top: 150px; width: 1000px; border: 1px solid rgba(246,246,243,0.14); border-radius: 14px; background: #141416; overflow: hidden; }
[id="03-outcome-bar"] { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid rgba(246,246,243,0.14); }
[id="03-outcome-bar"] i { width: 11px; height: 11px; border-radius: 50%; background: #6E6E73; opacity: 0.6; }
[id="03-outcome-addr"] { margin-left: 18px; font-family: "Zen Mono", monospace; font-size: 15px; color: #6E6E73; letter-spacing: 0.04em; }
[id="03-outcome-window"] img { display: block; width: 1000px; height: 625px; }

[class~="03-outcome-label"] { font-family: "Zen Mono", monospace; font-size: 20px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E73; line-height: 1; }

[id="03-outcome-left"] { position: absolute; left: 80px; top: 210px; width: 480px; }
[id="03-outcome-ai"] { position: relative; display: inline-block; margin-top: 36px; font-size: 220px; font-weight: 500; line-height: 0.95; letter-spacing: -0.04em; color: #F6F6F3; will-change: transform, filter; }
[class~="03-outcome-strike"] { position: absolute; left: -8px; right: -8px; top: 52%; height: 10px; background: #F6F6F3; transform-origin: left center; }
[id="03-outcome-platform"] { position: relative; display: inline-block; margin-top: 26px; font-family: "Zen Mono", monospace; font-size: 26px; color: #A1A1AA; white-space: nowrap; }
[id="03-outcome-platform"] [class~="03-outcome-strike"] { height: 3px; top: 50%; left: -4px; right: -4px; }
[id="03-outcome-sell"] { margin-top: 70px; }
[id="03-outcome-word"] { position: relative; display: inline-block; margin-top: 14px; font-size: 104px; font-weight: 500; line-height: 1; letter-spacing: -0.03em; color: #37D77C; transform-origin: left center; will-change: transform, filter; }
[id="03-outcome-under"] { position: absolute; left: 0; right: 0; bottom: -14px; height: 5px; background: #37D77C; transform-origin: left center; }

[id="03-outcome-right"] { position: absolute; left: 640px; top: 210px; width: 860px; height: 620px; }
[id="03-outcome-thoughts"], [id="03-outcome-outcomes"] { position: absolute; left: 0; top: 0; width: 860px; transform-origin: 0 40%; will-change: transform, filter; }
[class~="03-outcome-think"] { position: relative; height: 84px; display: flex; align-items: center; font-family: "Zen Mono", monospace; font-size: 30px; color: #F6F6F3; white-space: nowrap; border-bottom: 1px solid rgba(246,246,243,0.08); }
[class~="03-outcome-think"] b { font-weight: 400; color: #6E6E73; margin-right: 18px; }
[class~="03-outcome-caret"] { display: inline-block; width: 12px; height: 34px; margin-left: 4px; background: #F6F6F3; }
[class~="03-outcome-row"] { height: 86px; display: flex; align-items: center; gap: 28px; font-size: 42px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; will-change: transform, filter; }
[class~="03-outcome-box"] { position: relative; flex: 0 0 auto; width: 30px; height: 30px; border: 2px solid #37D77C; border-radius: 6px; box-sizing: border-box; }
[class~="03-outcome-box"] i { position: absolute; inset: 4px; border-radius: 2px; background: #37D77C; }
</style>

<div id="root" data-composition-id="03-outcome" data-width="1920" data-height="1080" data-duration="40.5">
  <div class="clip" id="03-outcome-ground" data-start="0" data-duration="40.5" data-track-index="0"></div>
  <div class="clip" id="03-outcome-scene" data-start="0" data-duration="40.5" data-track-index="1">
    <div id="03-outcome-world">
      <div id="03-outcome-window">
        <div id="03-outcome-bar"><i></i><i></i><i></i><span id="03-outcome-addr">hanzo.ai</span></div>
        <img src="assets/shots/chat.webp" alt="">
      </div>

      <div id="03-outcome-left">
        <div class="03-outcome-label" id="03-outcome-bad">Don't sell</div>
        <div id="03-outcome-ai" data-layout-allow-overlap>AI<div class="03-outcome-strike" id="03-outcome-strike1"></div></div>
        <div><div id="03-outcome-platform"><span id="03-outcome-ptext"></span><div class="03-outcome-strike" id="03-outcome-strike2"></div></div></div>
        <div class="03-outcome-label" id="03-outcome-sell">Sell</div>
        <div id="03-outcome-word">Outcome<div id="03-outcome-under"></div></div>
      </div>

      <div id="03-outcome-right">
        <div id="03-outcome-thoughts">
          <div class="03-outcome-label" id="03-outcome-theylabel" style="margin-bottom:18px">They think</div>
        </div>
        <div id="03-outcome-outcomes">
          <div class="03-outcome-label" id="03-outcome-givelabel" style="margin-bottom:18px">What they buy</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  const D = 40;
  const $ = (id) => document.getElementById(id);
  const tl = gsap.timeline({ paused: true });
  const EASE = "power3.out";

  // Owner thoughts: each types from its first spoken word to its last.
  const THOUGHTS = [
    { text: "I need more leads.", t0: 8.24, t1: 9.3 },
    { text: "I need more bookings.", t0: 9.6, t1: 10.7 },
    { text: "My website looks old.", t0: 11.12, t1: 12.6 },
    { text: "My form does not work.", t0: 12.96, t1: 14.5 },
    { text: "My business does not look professional online.", t0: 14.72, t1: 17.1 },
    { text: "I started building with AI and got stuck.", t0: 17.44, t1: 20.4 },
  ];
  // Outcomes: each row lands on its first spoken word.
  const OUTCOMES = [
    { text: "A better booking page", t: 23.84 },
    { text: "A website that works on mobile", t: 25.36 },
    { text: "A lead capture page", t: 27.28 },
    { text: "A client portal", t: 28.88 },
    { text: "A simple app for their customers", t: 30.24 },
    { text: "A finished version of their website", t: 32.32 },
  ];

  const thoughts = $("03-outcome-thoughts"), outcomes = $("03-outcome-outcomes");
  const lines = THOUGHTS.map((d, i) => {
    const row = document.createElement("div");
    row.className = "03-outcome-think";
    row.innerHTML = `<b>›</b><span></span><i class="03-outcome-caret"></i>`;
    thoughts.appendChild(row);
    return { ...d, row, span: row.querySelector("span"), caret: row.querySelector("i") };
  });
  const rows = OUTCOMES.map((d) => {
    const row = document.createElement("div");
    row.className = "03-outcome-row";
    row.innerHTML = `<div class="03-outcome-box"><i></i></div><span></span>`;
    row.querySelector("span").textContent = d.text;
    outcomes.appendChild(row);
    return { ...d, row, fill: row.querySelector("i") };
  });

  // Slow lean-in under the whole shot.
  tl.fromTo($("03-outcome-world"), { scale: 1 }, { scale: 1.035, duration: D - 0.5, ease: "sine.inOut" }, 0.2);

  // Scene 1: "AI" is named, then struck; the pitch line types and is struck.
  const PLATFORM = "AI transformation platform";
  tl.fromTo($("03-outcome-window"), { opacity: 0, x: 60 }, { opacity: 0.2, x: 0, duration: 1.0, ease: EASE }, 0.2);
  tl.fromTo($("03-outcome-bad"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 0.1);
  tl.fromTo($("03-outcome-ai"), { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 0.2);
  tl.fromTo($("03-outcome-strike1"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 1.12);
  tl.to($("03-outcome-ai"), { color: "#6E6E73", duration: 0.3, ease: "none" }, 1.5);
  tl.fromTo($("03-outcome-strike2"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 6.72);
  tl.to($("03-outcome-platform"), { color: "#6E6E73", duration: 0.3, ease: "none" }, 7.0);

  // Scene 2: the owner's own sentences type one by one.
  tl.fromTo($("03-outcome-theylabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 7.44);
  lines.forEach((l) => tl.fromTo(l.row, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: EASE }, l.t0 - 0.2));

  // One driver renders every typed string and caret from the playhead (seek-safe).
  const ptext = $("03-outcome-ptext");
  const slice = (text, t, t0, t1) => text.slice(0, Math.round(Math.min(1, Math.max(0, (t - t0) / (t1 - t0))) * text.length));
  const drive = { t: 0 };
  tl.fromTo(drive, { t: 0 }, {
    t: D, duration: D, ease: "none",
    onUpdate: () => {
      const t = drive.t;
      ptext.textContent = slice(PLATFORM, t, 5.28, 6.6);
      const blinkOn = Math.sin(t * Math.PI * 2 / 0.8) > -0.2;
      lines.forEach((l, i) => {
        l.span.textContent = slice(l.text, t, l.t0, l.t1);
        const next = i + 1 < lines.length ? lines[i + 1].t0 : 22.6;
        const active = t >= l.t0 - 0.2 && t < next - 0.2;
        const typing = t >= l.t0 && t <= l.t1;
        l.caret.style.opacity = active && (typing || blinkOn) ? "1" : "0";
      });
    },
  }, 0);

  // Scene 3: zoom-through swap from what they think to what you sell.
  const CUT = 22.9;
  tl.to(thoughts, { scale: 1.12, filter: "blur(10px)", opacity: 0, duration: 0.3, ease: "power3.in" }, CUT - 0.3);
  tl.fromTo($("03-outcome-sell"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 22.56);
  tl.fromTo($("03-outcome-word"), { opacity: 0, scale: 1.4, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" }, 23.12);
  tl.fromTo($("03-outcome-givelabel"), { opacity: 0, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, CUT);

  const entrances = [
    [{ scale: 0.8, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", ease: "power4.out" }],
    [{ x: -120 }, { x: 0, ease: "expo.out" }],
    [{ y: 50, rotation: 3 }, { y: 0, rotation: 0, ease: "circ.out" }],
    [{ x: 120 }, { x: 0, ease: "expo.out" }],
    [{ scale: 1.25, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", ease: "power4.out" }],
    [{ y: -40 }, { y: 0, ease: "circ.out" }],
  ];
  rows.forEach((r, i) => {
    const [from, to] = entrances[i];
    tl.fromTo(r.row, { opacity: 0, ...from }, { opacity: 1, ...to, duration: 0.5 }, r.t - 0.1);
    tl.fromTo(r.fill, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, r.t + 0.25);
  });

  // Scene 4: the offer reads easy; the outcome word is underlined and the room brightens.
  tl.to($("03-outcome-window"), { opacity: 0.34, duration: 1.2, ease: "power2.inOut" }, 35.52);
  tl.fromTo($("03-outcome-under"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 36.96);

  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines["03-outcome"] = tl;
})();
</script>
</template>
