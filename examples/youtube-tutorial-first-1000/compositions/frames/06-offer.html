  const tl = gsap.timeline({ paused: true });
  const EASE = "power3.out";

  // count-up: value tween + transform-scale growth, same start + ease (counting-dynamic-scale)

    const st = { v: 0 };
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, at);
    tl.to(st, { v: target, duration: dur, ease: EASE, onUpdate: () => { el.textContent = "$" + Math.round(st.v).toLocaleString("en-US"); } }, at);
    tl.fromTo(el, { scale: 0.55 }, { scale: 1, duration: dur, ease: EASE }, at);
  };

  // ---- Scene 1: the three offer cards assemble on their names; prices count on their words
  tl.fromTo($("06-offer-title"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.1);
  const cards = [$("06-offer-c1"), $("06-offer-c2"), $("06-offer-c3")];
  const CARD_AT = [4.48, 7.44, 10.88];
  cards.forEach((c, i) => {
    tl.fromTo(c, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.3 + i * 0.08);
    tl.fromTo(c.children[1], { color: "#6E6E73" }, { color: "#F6F6F3", duration: 0.4, ease: "none" }, CARD_AT[i]);
    tl.fromTo(c, { borderColor: "rgba(246,246,243,0.14)" }, { borderColor: "rgba(246,246,243,0.5)", duration: 0.4, ease: "power2.out" }, CARD_AT[i]);

  count($("06-offer-p1"), 500, 5.6, 1.4);

  tl.fromTo($("06-offer-tag1"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: EASE }, 12.88);

  count($("06-offer-p3"), 1000, 15.2, 1.6);

  // ---- Scene 2: the $1,000 card grows into the hero; the other two shrink into the left column
  const MORPH = 16.88, MD = 0.8;
  tl.to($("06-offer-c1"), { x: 0, y: -60, scale: 0.55, opacity: 0.45, duration: MD, ease: "power3.inOut" }, MORPH);
  tl.to($("06-offer-c2"), { x: -610, y: 195, scale: 0.55, opacity: 0.45, duration: MD, ease: "power3.inOut" }, MORPH);
  tl.to($("06-offer-c3"), { x: -840, y: -60, scale: 2.556, duration: MD, ease: "power3.inOut" }, MORPH);

  tl.to($("06-offer-title"), { opacity: 0.6, duration: 0.4, ease: "none" }, MORPH);
  tl.to([$("06-offer-c1"), $("06-offer-c2")], { borderColor: "rgba(246,246,243,0.14)", duration: 0.4, ease: "none" }, MORPH);

  // ---- Scene 3: the six inclusions check in on their words
  const CHECK_AT = [19.36, 20.0, 21.68, 24.4, 26.0, 27.36];
  gsap.utils.toArray($("06-offer-list").children).forEach((row, i) => {
    const at = CHECK_AT[i];
    tl.fromTo(row, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: EASE }, at - 0.15);
    tl.fromTo(row.firstElementChild.firstElementChild, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.7)" }, at);
    tl.fromTo(row.querySelector("path"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, at + 0.12);
    tl.fromTo(row, { color: "#A1A1AA" }, { color: "#F6F6F3", duration: 0.3, ease: "none" }, at);
  });

  // ---- Scene 4: the three exclusions arrive on "Do not include" and strike through on their words
  tl.fromTo($("06-offer-notlabel"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 28.72);
  const NOT_IN = [28.72, 31.28, 33.6];
  const STRIKE = [29.9, 32.3, 34.9];
  ["06-offer-n1", "06-offer-n2", "06-offer-n3"].forEach((id, i) => {
    const el = $(id);

    tl.fromTo(el.lastElementChild, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, STRIKE[i]);

  // Slow push under the hero hold.

  tl.set({}, {}, D);
