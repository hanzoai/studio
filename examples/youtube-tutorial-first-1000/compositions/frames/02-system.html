<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  const D = 11.5;
  const $ = (id) => document.getElementById(id);
  const tl = gsap.timeline({ paused: true });
  const EASE = "power3.out";

  // Virtual camera: one wrapper, one writer. Centers world point (cx, RAIL_Y) at screen (960, SCREEN_Y).
  const world = $("02-system-world");
  const RAIL_Y = 480, SCREEN_Y = 460;
  const cam = { s: 1.4, cx: 520 };
  const applyCamera = () => {
    const x = 960 - cam.cx * cam.s, y = SCREEN_Y - RAIL_Y * cam.s;
    world.style.transform = `translate(${x}px, ${y}px) scale(${cam.s})`;
  };
  applyCamera();

  // Rail and stations establish; labels sit dim as the map.
  tl.fromTo($("02-system-title"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.1);
  tl.fromTo($("02-system-track"), { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: EASE }, 0);
  [1, 2, 3, 4, 5].forEach((i) => {
    tl.fromTo($("02-system-s" + i), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: EASE }, 0.05 + i * 0.06);
  });
  gsap.set($("02-system-fill"), { scaleX: 0 });

  // Station k lights: ring draws, dot pops, label brightens with its own entrance, sub-label rises, rail fill reaches it.
  const entrances = [
    { from: { scale: 1.35, filter: "blur(8px)" }, to: { scale: 1, filter: "blur(0px)", ease: "power4.out" } },
    { from: { x: -60 }, to: { x: 0, ease: "expo.out" } },
    { from: { y: 40, rotation: 5 }, to: { y: 0, rotation: 0, ease: "circ.out" } },
    { from: { x: 60 }, to: { x: 0, ease: "expo.out" } },
    { from: { scale: 0.6 }, to: { scale: 1, ease: "back.out(2)" } },
  ];
  const light = (i, at, subAt) => {
    const arc = $("02-system-arc" + i);
    const len = arc.getTotalLength();
    arc.style.strokeDasharray = len;
    tl.fromTo(arc, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, at - 0.3);
    tl.fromTo($("02-system-dot" + i), { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, at + 0.2);
    const e = entrances[i - 1];
    tl.fromTo($("02-system-l" + i), { ...e.from }, { ...e.to, duration: 0.5 }, at);
    tl.to($("02-system-l" + i), { color: i === 5 ? "#37D77C" : "#F6F6F3", duration: 0.2, ease: "none" }, at);
    tl.fromTo($("02-system-sub" + i), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: EASE }, subAt);
    tl.to($("02-system-fill"), { scaleX: (i - 1) / 4, duration: 0.6, ease: "power2.inOut" }, at - 0.4);
  };
  // Word cues: client 1.36 · offer 2.96 · building 3.60 · draft 4.40 · Hanzo 5.20 · delivering 6.40 · paid 8.72
  light(1, 1.0, 2.96);
  light(2, 3.6, 5.2);
  light(3, 4.4, 4.7);
  light(4, 6.4, 7.6);
  light(5, 8.5, 8.72);

  // Pan from station to station, then pull out to the full map and hold.
  const pan = (cx, s, at, dur) => tl.to(cam, { cx, s, duration: dur, ease: "power2.inOut", onUpdate: applyCamera }, at);
  pan(700, 1.4, 2.0, 1.4);
  pan(900, 1.4, 3.7, 0.9);
  pan(1240, 1.4, 5.2, 1.2);
  pan(1400, 1.4, 7.1, 1.3);
  pan(960, 1.0, 9.3, 1.8);
  tl.to(cam, { s: 1.02, duration: 0.4, ease: "sine.out", onUpdate: applyCamera }, 11.1);

  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines["02-system"] = tl;
})();
</script>
