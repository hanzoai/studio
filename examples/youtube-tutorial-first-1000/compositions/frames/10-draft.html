  const wrap = (s, n) => {
    let out = "", len = 0;
    for (const w of s.split(" ")) {
      if (!len) { out += w; len = w.length; }
      else if (len + 1 + w.length > n) { out += "\n" + w; len = w.length; }
      else { out += " " + w; len += 1 + w.length; }
    }
    return out;
  };
  const at = (kf, t) => {
    if (t <= kf[0][0]) return 0;
    for (let i = 1; i < kf.length; i++) {
      const [a, na] = kf[i - 1], [b, nb] = kf[i];
      if (t < b) return b === a ? nb : Math.floor(na + (nb - na) * (t - a) / (b - a));
    }
    return kf[kf.length - 1][1];
  };
  const MSG_W = wrap(MSG, 34);
  const nottext = $("10-draft-nottext"), typed = $("10-draft-typed"), caret = $("10-draft-caret");

  // One clock drives both typed lines, so any seek renders the same frame.
