<template>
<style>
@font-face { font-family: "Zen"; src: url('assets/fonts/zen.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
@font-face { font-family: "Zen Mono"; src: url('assets/fonts/zen-mono.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
#root { position: absolute; inset: 0; overflow: hidden; font-family: "Zen", sans-serif; color: #F6F6F3; }
[id="11-qa-ground"] { position: absolute; inset: 0; background: #0B0B0D; }
[id="11-qa-scene"] { position: absolute; inset: 0; overflow: hidden; }

[id="11-qa-list"] { position: absolute; left: 80px; top: 150px; width: 700px; padding: 40px 48px 20px; box-sizing: border-box; background: #141416; border: 1px solid rgba(246,246,243,0.14); border-radius: 14px; }
[class~="11-qa-label"] { font-family: "Zen Mono", monospace; font-size: 20px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6E73; line-height: 1; }
[id="11-qa-rows"] { margin-top: 26px; }
[class~="11-qa-row"] { display: flex; align-items: center; gap: 24px; height: 76px; border-top: 1px solid rgba(246,246,243,0.14); font-family: "Zen Mono", monospace; font-size: 32px; font-weight: 400; color: #F6F6F3; white-space: nowrap; }
[class~="11-qa-box"] { position: relative; flex: none; width: 34px; height: 34px; border: 2px solid #6E6E73; border-radius: 8px; box-sizing: border-box; }
[class~="11-qa-fill"] { position: absolute; inset: -2px; border-radius: 8px; background: #37D77C; }
[class~="11-qa-box"] svg { position: absolute; inset: -2px; width: 34px; height: 34px; }
[class~="11-qa-box"] path { fill: none; stroke: #0B0B0D; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }

[class~="11-qa-win"] { position: absolute; border: 1px solid rgba(246,246,243,0.14); border-radius: 14px; background: #141416; overflow: hidden; }
[class~="11-qa-bar"] { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid rgba(246,246,243,0.14); box-sizing: border-box; }
[class~="11-qa-bar"] i { width: 11px; height: 11px; border-radius: 50%; background: #6E6E73; opacity: 0.6; }
[class~="11-qa-addr"] { margin-left: 18px; font-family: "Zen Mono", monospace; font-size: 15px; color: #6E6E73; letter-spacing: 0.04em; }
[id="11-qa-laptop"] { left: 860px; top: 150px; width: 900px; }
[id="11-qa-laptop"] img { display: block; width: 900px; height: 562px; }
[id="11-qa-phone"] { left: 1620px; top: 330px; width: 250px; border-radius: 28px; padding: 14px 10px; box-sizing: border-box; }
[id="11-qa-phone"] img { display: block; width: 230px; height: 460px; object-fit: cover; object-position: 50% 0; border-radius: 16px; }

[id="11-qa-cursor"] { position: absolute; left: 0; top: 0; width: 34px; height: 46px; }
[id="11-qa-cursor"] path { fill: #F6F6F3; stroke: #0B0B0D; stroke-width: 2; stroke-linejoin: round; }

[id="11-qa-quote"] { position: absolute; left: 260px; top: 300px; width: 1400px; padding: 44px 64px 52px; box-sizing: border-box; background: #141416; border: 1px solid rgba(246,246,243,0.14); border-radius: 14px; }
[id="11-qa-text"] { margin-top: 30px; font-family: "Zen Mono", monospace; font-size: 42px; font-weight: 400; line-height: 1.5; color: #F6F6F3; }
[id="11-qa-text"] span { visibility: hidden; }
[id="11-qa-text"] [class~="11-qa-money"] { color: #37D77C; }
</style>
<div id="root" data-composition-id="11-qa" data-width="1920" data-height="1080" data-duration="28">
  <div class="clip" id="11-qa-ground" data-start="0" data-duration="28" data-track-index="0"></div>
  <div class="clip" id="11-qa-scene" data-start="0" data-duration="28" data-track-index="1">
    <div class="11-qa-win" id="11-qa-laptop">
      <div class="11-qa-bar"><i></i><i></i><i></i><span class="11-qa-addr">client site</span></div>
      <img src="assets/shots/template-saas-landing.webp" alt="">
    </div>
    <div class="11-qa-win" id="11-qa-phone">
      <img src="assets/shots/template-saas-landing.webp" alt="">
    </div>
    <svg id="11-qa-cursor" viewBox="0 0 34 46"><path d="M3 3 L3 37 L12 29 L18 43 L24 40 L18 27 L30 27 Z"/></svg>

    <div id="11-qa-list" data-layout-allow-overlap>
      <div class="11-qa-label">Before handoff</div>
      <div id="11-qa-rows"></div>
    </div>

    <div id="11-qa-quote" data-layout-allow-overlap>
      <div class="11-qa-label">Final invoice</div>
      <div id="11-qa-text"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  const D = 27.5;
  const EASE = "power3.out";
  const $ = (id) => document.getElementById(id);
  const tl = gsap.timeline({ paused: true });

  // Checklist rows, each checked on its spoken word.
  const ITEMS = [
    ["Click every button", 2.32],
    ["Submit every form", 3.68],
    ["Check mobile", 4.88],
    ["Check spelling", 5.60],
    ["Booking link", 6.40],
    ["Phone number", 7.44],
    ["Email", 8.48],
  ];
  const rows = $("11-qa-rows");
  ITEMS.forEach(([label, t], i) => {
    const row = document.createElement("div");
    row.className = "11-qa-row";
    row.innerHTML = '<div class="11-qa-box"><div class="11-qa-fill"></div><svg viewBox="0 0 34 34"><path d="M9 17.5 L15 23 L25 12"/></svg></div><div>' + label + "</div>";
    rows.appendChild(row);
    const fill = row.firstChild.firstChild;
    const check = row.querySelector("path");
    const LEN = 26;
    check.style.strokeDasharray = LEN;
    tl.fromTo(row, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: EASE }, t - 0.25);
    tl.fromTo(fill, { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, t + 0.1);
    tl.fromTo(check, { strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t + 0.25);
  });

  // Establish: list panel, laptop and phone screens.
  tl.fromTo($("11-qa-list"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0);
  tl.fromTo($("11-qa-laptop"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: EASE }, 0.1);
  tl.fromTo($("11-qa-phone"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.35);

  // Cursor presses the laptop CTA on "click", then moves to the phone on "mobile".
  const cursor = $("11-qa-cursor");
  tl.fromTo(cursor, { x: 1560, y: 760, opacity: 0 }, { x: 1560, y: 760, opacity: 1, duration: 0.3, ease: "none" }, 1.4);
  tl.to(cursor, { x: 1256, y: 420, duration: 0.8, ease: "power2.inOut" }, 1.55);
  tl.set(cursor, { transformOrigin: "10% 7%" }, 0);
  tl.to(cursor, { scale: 0.82, duration: 0.1, ease: "power2.in" }, 2.4);
  tl.to(cursor, { scale: 1, duration: 0.25, ease: "back.out(3)" }, 2.5);
  tl.to(cursor, { x: 1700, y: 640, duration: 0.9, ease: "power2.inOut" }, 3.9);
  tl.to($("11-qa-phone"), { scale: 1.06, duration: 0.3, ease: EASE }, 4.88);
  tl.to($("11-qa-phone"), { scale: 1, duration: 0.5, ease: "power2.inOut" }, 5.2);

  // "Send the final invoice": list and screens dim, the quote card lands.
  const DIM = 9.92;
  tl.to([$("11-qa-list"), $("11-qa-laptop"), $("11-qa-phone"), cursor], { opacity: 0.08, duration: 0.6, ease: "power2.out" }, DIM);
  tl.fromTo($("11-qa-quote"), { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: EASE }, 10.6);

  // Invoice message types in, one span per character so wrapping never shifts.
  const MSG = "The final version is ready. Once the remaining balance is paid, I'll send over the live link, access details, and a quick walkthrough.";
  const HL = "remaining balance";
  const hlStart = MSG.indexOf(HL), hlEnd = hlStart + HL.length;
  const textEl = $("11-qa-text");
  const chars = [...MSG].map((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch;
    if (i >= hlStart && i < hlEnd) s.className = "11-qa-money";
    textEl.appendChild(s);
    return s;
  });
  // Segments paced to the spoken sentences: [first char, last char, start, end].
  const cut1 = MSG.indexOf("Once"), cut2 = MSG.indexOf("I'll");
  const SEG = [[0, cut1, 13.28, 14.8], [cut1, cut2, 15.12, 16.95], [cut2, MSG.length, 17.12, 20.9]];
  const countAt = (t) => {
    for (let i = SEG.length - 1; i >= 0; i--) {
      const [a, b, t0, t1] = SEG[i];
      if (t >= t0) return Math.floor(a + (b - a) * Math.min(1, (t - t0) / (t1 - t0)));
    }
    return 0;
  };
  const driver = { t: 0 };
  tl.fromTo(driver, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => {
    const n = countAt(driver.t);
    chars.forEach((s, i) => { s.style.visibility = i < n ? "visible" : "hidden"; });
  } }, 0);

  // Slow lean-in on the quote while the voice closes.
  tl.to($("11-qa-quote"), { scale: 1.03, duration: 5.5, ease: "power1.out" }, 21.2);

  tl.set({}, {}, D);
  window.__timelines = window.__timelines || {};
  window.__timelines["11-qa"] = tl;
})();
</script>
</template>
