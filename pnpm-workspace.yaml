# What may run its own install script. Vite's bundler is the only one, and a
# placeholder here is an install that stops to ask.
allowBuilds:
  esbuild: true

# One version of a package in the tree, whatever asked for it. Two copies of a
# React runtime are two contexts, and a component then looks for the one it was
# not rendered under. These are the versions the Hanzo app (hanzo-inc/app)
# resolves, so the studio the app mounts is the studio tested here.
overrides:
  '@hanzo/gui': 8.3.5
  '@hanzo/ui': 8.27.91
  '@hanzo/iam': 0.21.31
  '@hanzogui/animations-css': 8.3.5
  '@hanzogui/config': 8.3.5
  '@hanzogui/core': 8.3.5
  '@hanzogui/lucide-icons-2': 8.3.5
  '@hanzogui/next-theme': 8.3.5
  '@hanzogui/telemetry': 8.3.5
  '@hanzogui/toast': 8.3.5
  '@hanzogui/web': 8.3.5
  '@react-native/normalize-colors': 0.87.1
  # 15.16 reaches react-native's TurboModuleRegistry from its web build, which
  # react-native-web does not export; 15.15.5 is what @hanzo/build resolves.
  react-native-svg: 15.15.5
  react-is: 19.2.8

minimumReleaseAge: 0

catalog:
  '@axe-core/playwright': 4.14.0
