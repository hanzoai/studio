<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Hanzo Studio</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <!-- Unified Hanzo shell chrome (header + pre-footer + footer). Self-contained
       bundle built from web/shell (@hanzogui/shell), served at /marketing. -->
  <link rel="stylesheet" href="/marketing/shell.css">
  <style>
    /* Hanzo Studio sign-in. Every colour, every radius and the focus ring come
     * from @hanzo/design, which /marketing/shell.css loads above. This page
     * declares NO palette of its own, so a token fix or a brand fork reaches it
     * with no edit here.
     *
     * It used to hand-copy eleven console.hanzo.ai hex values into a private
     * :root. Seven of the eleven were blue-tinted while the comment claimed
     * "monochrome" (--muted #848a93 carried +15 blue over red, --text-2 +13),
     * and the card border #23262b measured 1.38:1 against the page — a boundary
     * you cannot see. Those names also SHADOWED design's own --border/--muted/
     * --primary/--radius, so aliasing them here would have formed a var() cycle;
     * referencing design directly is the only non-shadowing way to do this.
     *
     * Each var() carries design's own authored value as its literal fallback, so
     * the page stays legible if /marketing/shell.css ever fails to load. That is
     * the same pattern @hanzo/iam ships and it is why this page cannot go blank.
     *
     * Zen is the UI face. The stack keeps a system-grotesk fallback so the page
     * stays legible before the face arrives, or if it never does. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen', system-ui, -apple-system, BlinkMacSystemFont,
        'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--background, #000000);
      color: var(--foreground, #ededed);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      line-height: 1.5;
    }

    /* Growing hero that vertically centers the sign-in card between the
       unified header and pre-footer/footer. */
    .hero {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card, #0a0a0a);
      border: 1px solid var(--border, #1f1f1f);
      border-radius: var(--radius-lg, 0.75rem);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      text-align: center;
    }

    .mark { width: 40px; height: 40px; color: var(--foreground, #ededed); }
    .mark path { fill: currentColor; }

    .titles { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .title { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; color: var(--foreground, #ededed); }
    .subtitle { font-size: 14px; font-weight: 400; color: var(--text-secondary, rgb(255 255 255 / .80)); max-width: 300px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: var(--radius, 0.5rem);
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary { background: var(--primary, #ffffff); color: var(--primary-foreground, #000000); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary svg { width: 16px; height: 16px; }

    .footnote { font-size: 12px; color: var(--muted-foreground, #888888); text-align: center; }
    .footnote a { color: var(--text-secondary, rgb(255 255 255 / .80)); text-decoration: none; transition: color 0.15s; }
    .footnote a:hover { color: var(--foreground, #ededed); }

    /* The keyboard focus indicator. This page had none and fell through to the
       UA default; @hanzo/design ships this exact rule in tokens/base.css, which
       we cannot import here without its element defaults overriding the reset
       and Zen stack above, so the one rule is restated. --ring is #737373 as
       of @hanzo/design 0.3.0 — 4.43:1 on the page and 4.18:1 on the card, where
       WCAG 2.4.11 needs 3:1. It was #333333 (1.66:1) and could not have carried
       an indicator at all. */
    :focus-visible { outline: 2px solid var(--ring, #737373); outline-offset: 2px; }
  </style>
</head>
<body>
  <!-- Unified Hanzo marketing header (surface: studio.hanzo.ai). Rendered by
       /marketing/shell.js; the sign-in card below is the progressive-enhancement
       fallback and the primary auth action. -->
  <div id="hanzo-header"></div>

  <main class="hero">
  <div class="card">
    <div class="head">
      <svg class="mark" viewBox="0 0 67 67" role="img" aria-label="Hanzo" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.21 67V44.6369H0V67H22.21Z"/>
        <path d="M66.7038 22.3184H22.2534L0.0878906 44.6367H44.4634L66.7038 22.3184Z"/>
        <path d="M22.21 0H0V22.3184H22.21V0Z"/>
        <path d="M66.7198 0H44.5098V22.3184H66.7198V0Z"/>
        <path d="M66.7198 67V44.6369H44.5098V67H66.7198Z"/>
      </svg>
      <div class="titles">
        <div class="title">Hanzo Studio</div>
        <div class="subtitle">Sign in to build visual AI workflows — image, video, 3D, and audio.</div>
      </div>
    </div>

    <a class="btn btn-primary" id="login-btn" href="/login">
      Sign in with Hanzo
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L11.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 11-1.04-1.08l3.158-2.96H3.75A.75.75 0 013 10z" clip-rule="evenodd"/>
      </svg>
    </a>

    <p class="footnote">
      Powered by Hanzo IAM. New here?
      <a href="https://console.hanzo.ai">Create an account</a>.
    </p>
  </div>
  </main>

  <!-- Unified Hanzo pre-footer CTA + ecosystem footer (rendered by shell.js). -->
  <div id="hanzo-footer"></div>

  <script type="module" src="/marketing/shell.js"></script>
</body>
</html>
